<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="nav-container">
        <a class="logo" href="#">My Website</a>

        <nav class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main>
        <h1>Our Cards</h1>

        <section class="card-container">
            <article class="card">
                <h2>Card One</h2>
                <p>This is the first card in the responsive layout.</p>
            </article>

            <article class="card">
                <h2>Card Two</h2>
                <p>This is the second card in the responsive layout.</p>
            </article>

            <article class="card">
                <h2>Card Three</h2>
                <p>This is the third card in the responsive layout.</p>
            </article>

            <article class="card">
                <h2>Card Four</h2>
                <p>This is the fourth card in the responsive layout.</p>
            </article>
        </section>
    </main>
</body>
</html>
