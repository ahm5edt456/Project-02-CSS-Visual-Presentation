<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positioning</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="#">My Website</a>
        <div>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    <main>
        <h1>Positioning Cards</h1>

        <section class="card-container">
            <article class="card">
                <span class="badge">New</span>
                <h2>Card One</h2>
                <p>This card uses relative positioning as the badge's anchor.</p>
            </article>

            <article class="card">
                <span class="badge">Popular</span>
                <h2>Card Two</h2>
                <p>The notification badge is placed inside this card.</p>
            </article>

            <article class="card">
                <span class="badge">42</span>
                <h2>Card Three</h2>
                <p>Scroll the page to see the fixed navigation bar.</p>
            </article>
        </section>
    </main>

    <a class="back-to-top" href="#">↑ Back to top</a>
</body>
</html>
