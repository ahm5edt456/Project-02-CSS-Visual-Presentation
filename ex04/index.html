<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The CSS Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>The CSS Box Model</h1>
        <p>Both boxes have a declared width of 300px.</p>

        <section class="comparison">
            <article class="example">
                <h2>content-box</h2>
                <div class="box content-box">
                    Width: 300px<br>
                    Padding: 30px<br>
                    Border: 10px
                </div>
                <p class="total">Total width: 380px</p>
            </article>

            <article class="example">
                <h2>border-box</h2>
                <div class="box border-box">
                    Width: 300px<br>
                    Padding: 30px<br>
                    Border: 10px
                </div>
                <p class="total">Total width: 300px</p>
            </article>
        </section>
    </main>
</body>
</html>
